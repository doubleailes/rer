name: rust

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  release:
    types: [created]


env:
  CARGO_TERM_COLOR: always

jobs:
  build-doc-draft:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Build only 
        uses: shalzz/zola-deploy-action@v0.18.0
        env:
          BUILD_DIR: docs
          BUILD_ONLY: true
          BUILD_FLAGS: --drafts
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 🔨 Build
        run: cargo build
      - name: ✔️ Tests
        run: cargo test
  differential_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 🧪 Rust solver tests
        run: cargo test -p rer-resolver
      - name: 📦 Build rer_solver Python module
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          cd crates/rer-python && maturin develop
      - name: 🔍 Python differential tests
        run: |
          . .venv/bin/activate
          pytest tests/test_differential.py -v
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ⏲️ Bench
        run: cargo bench
  dry_publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
          toolchain: stable
          override: true
    - uses: katyo/publish-crates@v2
      with:
          dry-run: true
  publish:
    runs-on: ubuntu-latest
    needs: [dry_publish,bench,build_test,build-doc-draft]
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
          toolchain: stable
          override: true
    - uses: katyo/publish-crates@v2
      with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}