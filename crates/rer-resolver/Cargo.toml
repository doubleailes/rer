[package]
name = "rer-resolver"
version = { workspace = true }
description = "A faithful Rust port of rez's phase-based package solver."
edition = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
authors = { workspace = true }
license-file = { workspace = true }

[lib]
name = "rer_resolver"

[dependencies]
rer-version = { workspace = true }
# `serde` derive for `PackageData` (the repository is handed in as data).
serde = { workspace = true }
# Fast non-cryptographic hasher for the solver's hot-path maps/sets (package
# family names, requirement lookups).
rustc-hash = "2"

[dev-dependencies]
# Only the benchmark integration test deserialises fixtures.
serde_json = { workspace = true }
# `solver_micro` criterion bench — see `benches/solver_micro.rs`.
criterion = "0.5.1"

[[bench]]
name = "solver_micro"
harness = false
