[package]
name = "rer-resolver"
version = "0.0.1"
edition = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license-file = { workspace = true }

[lib]
name = "rer_resolver"

[dependencies]
rer-version = { workspace = true }
# `serde` derive for `PackageData` (the repository is handed in as data).
serde = { workspace = true }
# Fast non-cryptographic hasher for the solver's hot-path maps/sets (package
# family names, requirement lookups).
rustc-hash = "2"

[dev-dependencies]
# Only the benchmark integration test deserialises fixtures.
serde_json = { workspace = true }
