[package]
name = "rer-python"
version = { workspace = true }
description = "PyO3 bridge for the rer solver (published to PyPI as `pyrer`)."
edition = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
authors = { workspace = true }
# Use the SPDX expression here instead of inheriting `license-file = "LICENSE"`
# from the workspace. Maturin echoes the Cargo `license-file` into PKG-INFO as
# `License-File: LICENSE`, but in the sdist layout the file lives at
# `crates/rer-python/LICENSE`, not at the sdist root — PyPI rejects the
# mismatch. `License-Expression: MIT` is enough on its own.
license = "MIT"
publish = false

[lib]
# `pyrer` is a mixed Rust+Python package: this cdylib is the compiled
# extension `pyrer._native`, and the pure-Python `python/pyrer/` package
# wraps it and hosts the plugin SDK. `import pyrer` loads the Python
# package; it re-exports from `pyrer._native`.
name = "_native"
crate-type = ["cdylib", "lib"]

# abi3-py39 builds a single stable-ABI wheel that works on Python 3.9+,
# so the CI does not need to iterate (or accidentally pick up) interpreters
# newer than what this pyo3 version supports.
[dependencies]
pyo3 = { workspace = true, features = ["abi3-py39"] }
rer-resolver = { workspace = true }
rer-package = { workspace = true }
rer-version = { workspace = true }
