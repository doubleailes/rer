[package]
name = "rer-python"
version = { workspace = true }
description = "PyO3 bridge for the rer solver (published to PyPI as `pyrer`)."
edition = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
authors = { workspace = true }
license-file = { workspace = true }
publish = false

[lib]
# The Python import name — `rer-python` ships to PyPI as `pyrer`, so
# `import pyrer` in Python loads this cdylib.
name = "pyrer"
crate-type = ["cdylib", "lib"]

# abi3-py39 builds a single stable-ABI wheel that works on Python 3.9+,
# so the CI does not need to iterate (or accidentally pick up) interpreters
# newer than what this pyo3 version supports.
[dependencies]
pyo3 = { workspace = true, features = ["abi3-py39"] }
rer-resolver = { workspace = true }
# The package repository is passed across the bridge as JSON in the
# `PackageData` schema (name -> version -> {requires, variants}).
serde_json = { workspace = true }
