[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.2"
authors = [
    "Lorenzo Montant <lo.montant.pro@gmail.com>",
    "Maxim Doucet <maxim.doucet@gmail.com>",
    "Philippe Llerena<philippe.llerena@gmail.com>",
    "Rémi Viette <remi.viette@gmail.com>",
]
edition = "2021"
description = "A rez implementation in rust"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/doubleailes/rer"

[workspace.dependencies]
version-ranges = "0.1"
regex = "1.10.5"
lazy_static = "1.5.0"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rer-version = { path = "crates/rer-version", version = "1.0.0-rc.2" }
rer-resolver = { path = "crates/rer-resolver", version = "1.0.0-rc.2" }
rer-package = { path = "crates/rer-package", version = "1.0.0-rc.2" }
pyo3 = { version = "0.23.5", features = ["extension-module"] }
# `mimalloc` is wired into the bench binary as a `#[global_allocator]`.
# Callgrind shows ~33 % of cycles in libc malloc/free; mimalloc has measurably
# lower per-call cost on the small-object churn rer creates (`SmallVec` in
# `Ranges`, per-call `FxHashMap`s in `reduce_by`, etc.).
mimalloc = "0.1"
